opencollection: 1.0.0

info:
  name: Ledger API
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  variables:
    - name: BASE_URL
      value: http://127.0.0.1:8000/api
    - name: PROD_URL
      value: https://ledger-api-smyq.onrender.com/api
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
