info:
  name: Login testuser2
  type: http
  seq: 3

http:
  method: POST
  url: "{{BASE_URL}}/login/"
  body:
    type: json
    data: '{"username": "testuser2", "password": "12345678"}'
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: "res.body.token "
        method: jsonq
      variable:
        name: token_2
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
